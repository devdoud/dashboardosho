<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon : fichier autonome, hors CSS de l'app — les valeurs des jetons
       --logo-ring / --logo-mark sont donc recopiées ici, dans les deux thèmes. -->
  <style>
    .ring { stroke: #16181D; }
    .mark { stroke: #A8322A; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #F7F3EA; }
      .mark { stroke: #D4564A; }
    }
  </style>
  <path class="ring" d="M 82.08 33.65 A 36 36 0 1 1 66.35 17.92" fill="none" stroke-width="11" stroke-linecap="butt"/>
  <line class="mark" x1="66.97" y1="33.03" x2="83.94" y2="16.06" stroke-width="11" stroke-linecap="butt"/>
</svg>
